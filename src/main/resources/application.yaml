spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routers:
          - id: customer-service-route
            uri: lb://CustomerService
            predicates:
              - Path = /api/v1/auth/**
      enalbal: false
server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/



